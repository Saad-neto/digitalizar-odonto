version: '3.8'

services:
  digitalizar-odonto:
    image: digitalizar-odonto:latest
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      labels:
        # Traefik labels - HTTPS (aceita todos os domínios)
        - "traefik.enable=true"
        - "traefik.http.routers.digitalizar-odonto.rule=Host(`clinicanaweb.digitalizarmkt.com.br`) || Host(`sites-odonto.digitalizar.space`) || Host(`sites-odonto.digitalizarmkt.com.br`) || Host(`odonto.digitalizarmkt.com.br`)"
        - "traefik.http.routers.digitalizar-odonto.entrypoints=websecure"
        - "traefik.http.routers.digitalizar-odonto.tls=true"
        - "traefik.http.routers.digitalizar-odonto.tls.certresolver=letsencryptresolver"
        # Definir domínios do certificado explicitamente
        - "traefik.http.routers.digitalizar-odonto.tls.domains[0].main=clinicanaweb.digitalizarmkt.com.br"
        - "traefik.http.routers.digitalizar-odonto.tls.domains[1].main=sites-odonto.digitalizarmkt.com.br"
        - "traefik.http.routers.digitalizar-odonto.tls.domains[1].sans=odonto.digitalizarmkt.com.br"
        - "traefik.http.routers.digitalizar-odonto.tls.domains[2].main=sites-odonto.digitalizar.space"
        - "traefik.http.services.digitalizar-odonto.loadbalancer.server.port=80"

        # Redirect www to non-www
        - "traefik.http.middlewares.digitalizar-odonto-redirect.redirectregex.regex=^https://www\\.(.+)"
        - "traefik.http.middlewares.digitalizar-odonto-redirect.redirectregex.replacement=https://$${1}"
        - "traefik.http.middlewares.digitalizar-odonto-redirect.redirectregex.permanent=true"

        # HTTP to HTTPS redirect (todos os domínios)
        - "traefik.http.routers.digitalizar-odonto-http.rule=Host(`clinicanaweb.digitalizarmkt.com.br`) || Host(`sites-odonto.digitalizar.space`) || Host(`sites-odonto.digitalizarmkt.com.br`) || Host(`odonto.digitalizarmkt.com.br`)"
        - "traefik.http.routers.digitalizar-odonto-http.entrypoints=web"
        - "traefik.http.routers.digitalizar-odonto-http.middlewares=redirect-to-https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  # Servidor de Webhooks (Hotmart, etc)
  odonto-webhook:
    image: odonto-webhook:latest
    build:
      context: ./webhook-server
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=3001
      - SUPABASE_URL=https://hkvybshytzgzcrbqngdh.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrdnlic2h5dHpnemNyYnFuZ2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ5ODg3OTksImV4cCI6MjA4MDU2NDc5OX0.DaB2G5Qbz65leJzcYPEoE172uBr-UMMu4MhJEZhjtiM
      - HOTMART_WEBHOOK_SECRET=GzOKf6KgjW07rINPmmXTkEUbLg2jWW55656444
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        # Rota para webhooks: /api/webhook/*
        - "traefik.http.routers.odonto-webhook.rule=(Host(`clinicanaweb.digitalizarmkt.com.br`) || Host(`sites-odonto.digitalizar.space`) || Host(`sites-odonto.digitalizarmkt.com.br`) || Host(`odonto.digitalizarmkt.com.br`)) && PathPrefix(`/api/webhook`)"
        - "traefik.http.routers.odonto-webhook.entrypoints=websecure"
        - "traefik.http.routers.odonto-webhook.tls=true"
        - "traefik.http.routers.odonto-webhook.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.odonto-webhook.loadbalancer.server.port=3001"
        # Middleware para remover o prefixo /api/webhook
        - "traefik.http.middlewares.odonto-webhook-strip.stripprefix.prefixes=/api/webhook"
        - "traefik.http.routers.odonto-webhook.middlewares=odonto-webhook-strip"

networks:
  network_public:
    external: true
